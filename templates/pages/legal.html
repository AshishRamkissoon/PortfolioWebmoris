{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ page.title }} · {{ site_settings.site_name }}{% endblock %}

{% block content %}
<article class="container-site max-w-3xl py-24 sm:py-32">
  <h1 class="font-display text-5xl font-bold tracking-tight">{{ page.title }}</h1>
  <p class="mt-4 text-sm text-ink-400">{% translate "Last updated" %}: {{ page.updated_at|date:"DATE_FORMAT" }}</p>
  <div class="prose-site mt-10">{{ page.body|linebreaks }}</div>
</article>
{% endblock %}
