{% load i18n %}
<div role="status" class="py-10 text-center" data-reveal>
  <span hidden data-track-event="lead_submitted"></span>
  <div class="mx-auto grid size-16 place-items-center rounded-full bg-neon-cyan text-3xl text-ink-950" aria-hidden="true">✓</div>
  <h2 class="mt-6 font-display text-3xl font-bold">{% translate "Thank you — message received!" %}</h2>
  <p class="mx-auto mt-3 max-w-md text-ink-300">{% translate "We'll get back to you within one business day. A confirmation has been sent to your email." %}</p>
  {% if site_settings.whatsapp_link %}
    <a href="{{ site_settings.whatsapp_link }}" target="_blank" rel="noopener noreferrer" class="btn-ghost mt-8 inline-flex" data-track="whatsapp_click">{% translate "Need it faster? Chat on WhatsApp" %}</a>
  {% endif %}
</div>
