{% load i18n %}
<header data-site-header x-data="{ open: false }" @keydown.escape.window="open = false"
        class="site-header sticky top-0 z-40">
  <div class="container-site flex h-18 items-center justify-between gap-6">
    <a href="{% url 'core:home' %}" class="font-display text-xl font-bold tracking-tight">
      {{ site_settings.site_name }}<span class="text-neon-cyan">.</span>
    </a>

    <nav aria-label="{% translate 'Main' %}" class="hidden items-center gap-7 lg:flex">
      {% include "partials/nav_links.html" %}
    </nav>

    <div class="hidden items-center gap-4 lg:flex">
      {% include "partials/language_switcher.html" %}
      <a href="{% url 'leads:contact' %}" class="btn-primary">{% translate "Get a Quote" %}</a>
    </div>

    <button type="button" class="lg:hidden rounded-full p-2 text-ink-100 hover:bg-ink-800"
            @click="open = !open" :aria-expanded="open.toString()" aria-expanded="false"
            aria-controls="mobile-menu">
      <span class="sr-only">{% translate "Menu" %}</span>
      <svg x-show="!open" class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg x-show="open" x-cloak class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="mobile-menu" x-show="open" x-cloak
       x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="opacity-0 -translate-y-4"
       x-transition:leave="transition duration-200 ease-in" x-transition:leave-end="opacity-0 -translate-y-4"
       class="glass border-t border-ink-800 lg:hidden">
    <nav aria-label="{% translate 'Mobile' %}" class="container-site flex flex-col gap-5 py-8 text-lg">
      {% include "partials/nav_links.html" %}
      <div class="flex items-center justify-between pt-4">
        {% include "partials/language_switcher.html" %}
        <a href="{% url 'leads:contact' %}" class="btn-primary">{% translate "Get a Quote" %}</a>
      </div>
    </nav>
  </div>
</header>
