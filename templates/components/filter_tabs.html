{% load i18n %}
{# Filter links that work without JS and swap #<target> through HTMX.
   Usage: include with items=<qs with .slug/.name> active=<obj|None> base_url=... param="category" target="project-grid" label=... #}
{% if items %}
<nav aria-label="{{ label }}" class="mb-10 flex flex-wrap gap-2">
  <a href="{{ base_url }}" class="filter-tab" {% if not active %}aria-current="true"{% endif %}
     hx-get="{{ base_url }}" hx-target="#{{ target }}" hx-swap="outerHTML" hx-push-url="true">{% translate "All" %}</a>
  {% for item in items %}
  <a href="{{ base_url }}?{{ param }}={{ item.slug }}" class="filter-tab" {% if active == item %}aria-current="true"{% endif %}
     hx-get="{{ base_url }}?{{ param }}={{ item.slug }}" hx-target="#{{ target }}" hx-swap="outerHTML" hx-push-url="true">{{ item.name }}</a>
  {% endfor %}
</nav>
{% endif %}
