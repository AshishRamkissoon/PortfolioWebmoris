{% load i18n %}
{# Numbers render in full; JS counts them up from 0 when motion is allowed. #}
<section class="border-y border-ink-800 bg-ink-900/60" aria-label="{% translate 'Key figures' %}">
  <dl class="container-site grid grid-cols-2 gap-8 py-14 lg:grid-cols-4">
    {% for value, label in site_settings.stats %}
    <div data-reveal data-reveal-delay="0.{{ forloop.counter0 }}" class="flex flex-col-reverse">
      <dt class="mt-2 text-sm uppercase tracking-widest text-ink-400">{{ label }}</dt>
      <dd class="font-display text-5xl font-bold"><span data-count-up="{{ value }}">{{ value }}</span><span class="text-neon-cyan">+</span></dd>
    </div>
    {% endfor %}
  </dl>
</section>
