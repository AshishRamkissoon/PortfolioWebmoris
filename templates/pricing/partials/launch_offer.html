{% load i18n %}
{% if site_settings.offer_enabled and site_settings.offer_title %}
<aside data-reveal class="rounded-card border border-neon-cyan bg-ink-900 p-6 shadow-glow sm:p-8">
  <p class="eyebrow">{% translate "Limited offer" %}</p>
  <h2 class="mt-3 font-display text-2xl font-bold">{{ site_settings.offer_title }}</h2>
  {% if site_settings.offer_text %}<p class="mt-2 max-w-3xl text-ink-300">{{ site_settings.offer_text|linebreaksbr }}</p>{% endif %}
</aside>
{% endif %}
